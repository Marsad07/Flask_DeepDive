{% extends "admin_base.html" %}

{% block admin_content %}

<!-- This loads Vue 3 via CDN — no build step needed -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<div class="dash-page">
    <!-- Page header -->
    <div class="dash-header">
        <div>
            <h1>All Orders</h1>
            <p class="dash-welcome">Manage and track every takeaway order</p>
        </div>
        <a href="{{ url_for('admin.dashboard') }}" class="btn-back">← Dashboard</a>
    </div>

    <!-- Stat cards -->
    <div class="dash-stats dash-stats-4" style="margin-bottom: 32px;">
        <div class="stat-card stat-card-dark">
            <div class="stat-number">{{ today_count }}</div>
            <div class="stat-label">Orders Today</div>
        </div>
        <div class="stat-card stat-card-red">
            <div class="stat-number">{{ active_count }}</div>
            <div class="stat-label">Active Orders</div>
        </div>
        <div class="stat-card stat-card-gold">
            <div class="stat-number">£{{ "%.2f"|format(today_revenue) }}</div>
            <div class="stat-label">Today's Revenue</div>
        </div>
        <div class="stat-card stat-card-brown">
            <div class="stat-number">{{ cancelled_today }}</div>
            <div class="stat-label">Cancelled Today</div>
        </div>
    </div>
    <!-- This is the Vue app wrapper — search, filters and table are all reactive -->
    <div id="orders-app">

        <!-- Search and filters — now controlled by Vue instead of form submission -->
        <div class="dash-card dash-card-body" style="margin-bottom: 24px;">
            <div class="form-row" style="align-items: flex-end; gap: 12px; flex-wrap: wrap;">

                <!-- This search input updates the Vue data instantly as the user types -->
                <div style="flex: 1; min-width: 220px;">
                    <label class="form-label">Search</label>
                    <input type="text"
                           class="form-input"
                           placeholder="Name, email or order ID..."
                           v-model="search">
                </div>

                <!-- These filter pills update the active filter without a page reload -->
                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 2px;">
                    <button v-for="f in filters"
                            :key="f.val"
                            type="button"
                            :class="['coupon-filter-btn', { active: activeFilter === f.val }]"
                            @click="activeFilter = f.val">
                        {% raw %}{{ f.label }}{% endraw %}
                    </button>
                </div>

            </div>
        </div>

        <!-- Orders table -->
        <div class="dash-card">
            <template v-if="filteredOrders.length > 0">
                <!-- Desktop table -->
                <div class="desktop-table">
                    <table class="dash-table">
                        <thead>
                            <tr>
                                <th>Order</th>
                                <th>Customer</th>
                                <th>Type</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Placed</th>
                                <th class="center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- This renders each filtered order row reactively -->
                            <tr v-for="order in filteredOrders" :key="order.order_id">
                                <td>
                                    <span style="font-family: var(--font-heading); font-weight: 700;
                                                 color: var(--color-text); font-size: 13px;">
                                        {% raw %}#{{ order.order_id }}{% endraw %}
                                    </span>
                                </td>
                                <td>
                                    <p class="resv-customer-name">
                                        {% raw %}{{ order.customer_name }}{% endraw %}
                                    </p>
                                    <p class="resv-customer-email">
                                        {% raw %}{{ order.customer_email }}{% endraw %}
                                    </p>
                                </td>
                                <td>
                                    <span style="font-size: 13px; font-weight: 600; color: var(--color-text);">
                                        {% raw %}{{ order.order_type === 'delivery' ? '🚗' : '🏪' }}
                                        {{ order.order_type_display }}{% endraw %}
                                    </span>
                                </td>
                                <td>
                                    <span style="font-size: 13px; color: var(--color-text-muted);">—</span>
                                </td>
                                <td>
                                    <span style="font-weight: 700; color: var(--color-primary); font-size: 15px;">
                                        {% raw %}£{{ order.total_price }}{% endraw %}
                                    </span>
                                </td>
                                <td>
                                    <!-- This uses the data-status attribute so existing CSS badge colours apply -->
                                    <span class="dash-resv-badge"
                                          :data-status="order.order_status">
                                        {% raw %}{{ order.status_display }}{% endraw %}
                                    </span>
                                </td>
                                <!-- This stores the datetime for the timeAgo function -->
                                <td>
                                    <span class="rel-time"
                                          :data-datetime="order.datetime"
                                          :title="order.datetime_title">
                                    </span>
                                </td>
                                <td class="center">
                                    <a :href="order.view_url" class="btn-small btn-small-gold">
                                        View
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Mobile cards -->
                <div class="mobile-cards" style="padding: 16px;">
                    <div v-for="order in filteredOrders" :key="'mob-' + order.order_id"
                         style="background: var(--color-bg); border: 1px solid var(--color-accent);
                                border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
                                border-left: 4px solid var(--color-primary);">
                        <div style="display: flex; justify-content: space-between;
                                     align-items: flex-start; margin-bottom: 12px;">
                            <div>
                                <p style="margin: 0; font-family: var(--font-heading); font-weight: 700;
                                           font-size: 16px; color: var(--color-text);">
                                    {% raw %}#{{ order.order_id }}{% endraw %}
                                </p>
                                <!-- This also uses rel-time for the mobile card timestamp -->
                                <p class="rel-time"
                                   :data-datetime="order.datetime"
                                   :title="order.datetime_title"
                                   style="margin: 4px 0 0; font-size: 12px; color: var(--color-text-muted);">
                                </p>
                            </div>
                            <span class="dash-resv-badge" :data-status="order.order_status">
                                {% raw %}{{ order.status_display }}{% endraw %}
                            </span>
                        </div>
                        <p style="margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--color-text);">
                            {% raw %}{{ order.customer_name }}{% endraw %}
                        </p>
                        <p style="margin: 0 0 12px; font-size: 12px; color: var(--color-text-muted);">
                            {% raw %}{{ order.customer_email }}{% endraw %}
                        </p>
                        <div style="display: flex; justify-content: space-between;
                                     align-items: center; margin-bottom: 14px;">
                            <span style="font-size: 13px; color: var(--color-text);">
                                {% raw %}{{ order.order_type === 'delivery' ? '🚗' : '🏪' }}
                                {{ order.order_type_display }}{% endraw %}
                            </span>
                            <span style="font-weight: 700; color: var(--color-primary); font-size: 18px;">
                                {% raw %}£{{ order.total_price }}{% endraw %}
                            </span>
                        </div>
                        <a :href="order.view_url"
                           class="btn-primary"
                           style="display: block; text-align: center; width: 100%; box-sizing: border-box;">
                            View Order
                        </a>
                    </div>
                </div>

                <!-- Result count — reactive to current filter/search state -->
                <p style="padding: 14px 24px; font-size: 13px; color: var(--color-text-muted);
                           border-top: 1px solid rgba(0,0,0,0.05); margin: 0;">
                    {% raw %}Showing {{ filteredOrders.length }} order{{ filteredOrders.length !== 1 ? 's' : '' }}
                    <span v-if="search"> matching "<strong>{{ search }}</strong>"</span>
                    <span v-if="activeFilter"> · filtered by <strong>{{ activeFilter }}</strong></span>{% endraw %}
                </p>

            </template>
            <!-- This shows when no orders match the current search or filter -->
            <template v-else>
                <p class="dash-empty">
                    <template v-if="search || activeFilter">
                        No orders match your search or filter.
                        <a href="#" @click.prevent="search = ''; activeFilter = ''"
                           style="color: var(--color-primary); font-weight: 700;">
                            Clear filters
                        </a>
                    </template>
                    <template v-else>No orders yet.</template>
                </p>
            </template>
        </div>
    </div> <!-- end orders-app -->
</div>
<script>
    // This converts every .rel-time element's data-datetime into a human-readable relative string
    function timeAgo(datetimeStr) {
        const then  = new Date(datetimeStr);
        const now   = new Date();
        const diff  = Math.floor((now - then) / 1000); // seconds

        if (diff < 60)                        return 'Just now';
        if (diff < 3600)  {
            const m = Math.floor(diff / 60);
            return m + ' min ago';
        }
        if (diff < 86400) {
            const h = Math.floor(diff / 3600);
            return h + ' hr' + (h !== 1 ? 's' : '') + ' ago';
        }
        if (diff < 604800) {
            const d = Math.floor(diff / 86400);
            return d + ' day' + (d !== 1 ? 's' : '') + ' ago';
        }
        // Older than a week — show the actual date from the title attribute
        return then.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // This is the raw orders data from Flask — passed into Vue as the initial dataset
    const ordersData = [
        {% for order in orders %}
        {
            order_id:        {{ order.order_id }},
            customer_name:   "{{ (order.customer_fullname or order.guest_fullname or '') | e }}",
            customer_email:  "{{ (order.customer_email or order.guest_email or '') | e }}",
            order_type:      "{{ order.order_type }}",
            order_type_display: "{{ order.order_type | capitalize }}",
            total_price:     "{{ '%.2f' | format(order.total_price) }}",
            order_status:    "{{ order.order_status }}",
            status_display:  "{{ order.order_status | capitalize }}",
            datetime:        "{{ order.order_date.strftime('%Y-%m-%d') }}T{{ order.order_time }}",
            datetime_title:  "{{ order.order_date.strftime('%d %b %Y') }} at {{ order.order_time }}",
            view_url:        "{{ url_for('admin.view_customer_order', order_id=order.order_id) }}"
        },
        {% endfor %}
    ];

    // This is the Vue 3 app that handles live search and filtering
    const { createApp, ref, computed, nextTick } = Vue;

    createApp({
        setup() {
            // This holds the current search query and active filter pill
            const search       = ref('{{ search }}');
            const activeFilter = ref('{{ filter_type }}');

            // These are the filter pill options
            const filters = [
                { val: '',           label: 'All' },
                { val: 'today',      label: 'Today' },
                { val: 'delivery',   label: '🚗 Delivery' },
                { val: 'collection', label: '🏪 Collection' },
                { val: 'pending',    label: 'Pending' },
                { val: 'confirmed',  label: 'Confirmed' },
                { val: 'preparing',  label: 'Preparing' },
                { val: 'ready',      label: 'Ready' },
                { val: 'completed',  label: 'Completed' },
                { val: 'cancelled',  label: 'Cancelled' },
            ];

            // This computes the filtered orders list reactively whenever search or filter changes
            const filteredOrders = computed(() => {
                let results = ordersData;
                const q = search.value.toLowerCase().trim();

                // This applies the text search across name, email and order ID
                if (q) {
                    results = results.filter(o =>
                        o.customer_name.toLowerCase().includes(q)  ||
                        o.customer_email.toLowerCase().includes(q) ||
                        String(o.order_id).includes(q)
                    );
                }

                // This applies the active filter pill
                if (activeFilter.value) {
                    const f = activeFilter.value;

                    if (f === 'today') {
                        // This filters to orders placed today using the datetime field
                        const todayStr = new Date().toISOString().slice(0, 10);
                        results = results.filter(o => o.datetime.startsWith(todayStr));
                    } else if (f === 'delivery' || f === 'collection') {
                        results = results.filter(o => o.order_type === f);
                    } else {
                        // This filters by order status
                        results = results.filter(o => o.order_status === f);
                    }
                }

                return results;
            });

            // This updates the rel-time spans after Vue re-renders the DOM
            const updateTimestamps = () => {
                nextTick(() => {
                    document.querySelectorAll('.rel-time').forEach(function(el) {
                        if (el.dataset.datetime) {
                            el.textContent = timeAgo(el.dataset.datetime);
                        }
                    });
                });
            };

            return { search, activeFilter, filters, filteredOrders, updateTimestamps };
        },

        // This runs the timestamp update after every render
        updated() { this.updateTimestamps(); },
        mounted()  { this.updateTimestamps(); }

    }).mount('#orders-app');
</script>
{% endblock %}
